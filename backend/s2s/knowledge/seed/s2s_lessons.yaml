  - id: s2s-ops-002
    kind: s2s_lesson
    title: "EDA tools run in a container that mounts only the runner's work folder"
    symptom: "A tool fails with FileNotFoundError for a file that exists on the host (sby copy_src)"
    root_cause: "runner.run mounts only `workdir` into the s2s-eda container; the D2 equivalence proof referenced the original RTL outside its eq/ folder, so every proof failed (safely: counted as undecided)."
    wrong_assumption: "A unit test with a fake runner proves the tool sees the same files as the host."
    lesson: "Copy every input into the folder passed to runner.run (or pass a parent folder as workdir). Unit tests that fake the runner must assert that every file the tool reads is inside workdir, and a new tool integration needs one real-tool run before use."
    evidence: "uart mutation run 2026-10-05 20:49 (22 proofs, all sby FileNotFoundError); fixed and re-checked with the real tools"
    regression_test: "tests/test_mutation_equiv.py::test_only_proven_equivalent_mutants_are_screened_out"
    tags: [runner, docker, container, mount, workdir, sby, mutation, tooling, operations]
    source: {title: "S2S mutation_run fix 2026-10-05", url: "docs/DECISIONS.md"}
    date: "2026-10-05"
    confidence: high
    owner: Sage
  - id: s2s-eq-002
    kind: s2s_lesson
    title: "Synthesis re-encoded an FSM: give the LEC the state mapping from the synthesis log, then prove it"
    symptom: "RTL vs netlist LEC leaves every point of one FSM's fan-out unproven (state register widths differ, e.g. 3-bit RTL state vs 5 netlist flops; one state bit missing by name); eqy times out proving partitions"
    root_cause: "OpenLane's Yosys synthesis always runs `fsm`; fsm_recode re-encodes FSMs ('auto' -> one-hot for small FSMs) and fsm_opt can merge a state bit with an identical FSM output (uart: IDLE bit == tx_ready). Name-based register correspondence cannot pair a binary register with one-hot flops."
    wrong_assumption: "An unproven point after synthesis means the netlist differs from the RTL; or: an unbounded no-correspondence proof (PDR/dprove from reset) will settle it (it stays UNDECIDED: real differences need counterexamples hundreds of cycles deep)."
    lesson: "Read the 'Recoding FSM' map (old -> new codes) and the FSM output list from the synthesis log; give equiv_make -encfile the map (Yosys' own fsm_recode -encfile format, the open-source counterpart of Formality SVF FSM guidance) and a named alias of the new state flops in the checker's copy of the netlist only (a merged bit is found through non-inverting buffers: place and route inserts output buffers, dfxtp .Q(net42) -> buf_1 -> tx_ready). The map is a correspondence hypothesis equiv_induct must prove; a wrong map leaves points unproven, it cannot pass anything. Always confirm with known-bad RTL (caught mutants) that the check still fails. Never trust FSM guidance without the proof, and never change the signed-off netlist."
    evidence: "uart run_01M47BE6QKCPAEAE7RVYYJ9TEY synth: 105 proven / 19 unproven without map; 125/125 with map; caught mutants tx_L153_stuck_bit_2, tx_L56_dropped_handshake_3, rx_L113_swapped_condition_2 all fail (2, 1, 3 unproven). PDR/dprove from reset: control mutant UNDECIDED (scratch_uart_synth_eq)."
    regression_test: "tests/platform/test_lec_fallback.py::test_lec_with_fsm_map_still_rejects_real_bugs (synthesized and routed netlist)"
    tags: [equivalence, lec, fsm, fsm_recode, one_hot, encoding, encfile, eqy, yosys, synthesis, netlist, sienna, uart]
    source: {title: "Yosys fsm_recode -encfile / equiv_make -encfile", url: "https://yosyshq.readthedocs.io/projects/yosys/en/0.40/cmd/fsm_recode.html"}
    date: "2026-10-06"
    confidence: high
    owner: Sage
  - id: s2s-pnr-002
    kind: s2s_lesson
    title: "OpenLane's post-route DRV count can miss clock-buffer fanout; check with an independent STA run"
    symptom: "Place and route reports max_fanout_violations = 0, but signoff STA on the same routed netlist and SDC fails max fanout on clock buffers (clkbuf_0_clk 16 vs 10, three leaf buffers 11)"
    root_cause: "Root cause found later (lesson s2s-sdc-001): an SDC comment containing 'set_propagated_clock' made OpenLane leave the clock ideal after CTS, and OpenSTA skips fanout/slew/cap checks on ideal clock nets. OpenLane's post-route STA therefore listed no violators while S2S's propagated-clock OpenSTA on the same netlist and SDC reported clkbuf_0_clk 16 vs 10."
    wrong_assumption: "The OpenLane metric is the same as running report_check_types ourselves."
    lesson: "Every place-and-route iteration also runs S2S's own OpenSTA report_check_types on the routed netlist with the reviewed SDC; a violator from EITHER tool is a problem for Orion. Fix clock-tree fanout with the tree-shape knobs (lesson s2s-cts-001); count each violating buffer's level first."
    evidence: "uart run_01M47BE6QKCPAEAE7RVYYJ9TEY it1 (CTS_SINK_CLUSTERING_SIZE 25): pnr_iteration_1 max_fanout_violations 0; signoff sta_all_corners FAILED; logs/sta_uart_top_*.log"
    regression_test: "tests/test_pnr_independent_drv.py"
    tags: [cts, clock_tree, fanout, max_fanout, drv, sta, opensta, openlane, signoff, orion, chronos, place_route, uart]
    source: {title: "S2S DECISIONS 2026-10-06", url: "docs/DECISIONS.md"}
    date: "2026-10-06"
    confidence: high
    owner: Sage
  - id: s2s-ops-003
    kind: s2s_lesson
    title: "A long-running orchestrator keeps the code it started with"
    symptom: "A fix is committed and tested, but the next stage run by the orchestrator behaves as before"
    root_cause: "The orchestrator imports the agents and tool adapters once at start; uart's signoff (03:32) ran the LEC without the FSM map committed at 02:15 because the orchestrator had started at 01:25."
    lesson: "The orchestrator logs its code fingerprint at start and warns once when the source changes. After changing agent or tool code, restart the orchestrator (or run the task in a fresh runner) before the stage that needs the change, at a point where no worker is mid-step; check the process start time against the commit time."
    evidence: "uart eqy_rtl_vs_final 03:32: 105/19 again; orchestrator pid 1130 started 01:25:54"
    regression_test: "tests/test_orchestrator_code_fingerprint.py"
    tags: [orchestrator, restart, stale_code, deployment, operations]
    source: {title: "S2S DECISIONS 2026-10-06", url: "docs/DECISIONS.md"}
    date: "2026-10-06"
    confidence: high
    owner: Sage
  - id: s2s-cts-003
    kind: s2s_lesson
    title: "Small clock trees (~100-200 sinks): clustering knobs do nothing; the H-tree stop rule and placement set leaf fanout"
    symptom: "Leaf clock buffers stay 1-2 over the fanout limit whatever CTS_SINK_CLUSTERING_SIZE / MAX_DIAMETER / buffer distance / max wire length is set to"
    root_cause: "On uart (125 sinks) TritonCTS prints the clustering settings but never reports 'sinks after clustering'; the H-tree stops splitting at <= 15 sinks per branch (CTS-0032), so each leaf buffer drives whatever flops fall in its region. Which leaf gets 11 or 12 depends on where the flops are placed."
    wrong_assumption: "Lowering the cluster size caps the flops per leaf buffer (iterations 2-3: size 10 and 9 gave bit-identical trees); the extra load is an antenna diode (it was a flop)."
    lesson: "Diagnose before iterating: the P&R loop now gives Orion the CTS log facts and each violator's level and loads, requires a diagnosis, and refuses clustering knobs when clustering was not applied and any knob that left the problems identical. Check the CTS log for 'sinks after clustering' before tuning clustering. If clustering is not applied, change the flop spread instead: placement density / core utilization inside pnr_ranges.yaml, screened with recorded CTS-only experiments and scored by the independent STA check, then route the best to confirm."
    evidence: "uart reports/experiments/PNR-UART-0001..0016: CTS knobs 0001-0006 no change; density 60 % (0013) and 65 % (0014) 0 violators after CTS and after routing; util 30/40 %, density 70/80 % still 11-12; util 55 % and density 45 % failed placement (GPL-0302)"
    regression_test: "tests/test_pnr_diagnosis.py"
    tags: [cts, clock_tree, fanout, max_fanout, sink_clustering, h_tree, placement, density, utilization, orion, tick, place_route, uart]
    source: {title: "S2S uart M0.7 experiments 2026-10-06", url: "run:run_01M47BE6QKCPAEAE7RVYYJ9TEY"}
    date: "2026-10-06"
    confidence: high
    owner: Sage
  - id: s2s-sdc-001
    kind: s2s_lesson
    title: "Never write 'propagated_clock' in an SDC, not even in a comment: OpenLane then leaves the clock ideal after CTS"
    symptom: "OpenLane's post-route STA shows 'clock network delay (ideal)' and lists the clock in unpropagated.rpt; its timing differs from an independent propagated-clock STA by the clock latency (uart: ~1 ns setup at ss); clock-buffer fanout violators are not reported"
    root_cause: "OpenLane 2.3.10 io.tcl propagates clocks only if the raw SDC text does not contain 'set_propagated_clock' or 'unset_propagated_clock'. uart's SDC had the comment '# set_propagated_clock is intentionally not set ...' - copied from S2S's own SDC contract line 'Do not set set_propagated_clock'. So every OpenLane timing step and repair after CTS (resizer, hold repair, post-route STA) used an ideal clock, and OpenSTA skips slew/cap/fanout checks on ideal clock nets."
    wrong_assumption: "A comment cannot change what a tool does; OpenLane's max-fanout count of 0 was a real measurement; the instruction text given to an agent is harmless."
    lesson: "The SDC guard refuses the text 'propagated_clock' anywhere; the P&R loop fails an iteration whose post-route STA left a clock unpropagated (unpropagated.rpt); signoff compares OpenLane STA with S2S's own STA (sta_matches_openlane). Write agent instructions so that echoing them into a file is harmless."
    evidence: "uart run_01M47BE6QKCPAEAE7RVYYJ9TEY: constraints.sdc line 36; it4/54-openroad-stapostpnr/*/unpropagated.rpt = clk at 9 corners vs sync_fifo it10 empty; worst path data arrival identical (14.7561 ns), capture clock 0 (ideal) vs 0.9366 ns (propagated)"
    regression_test: "tests/test_propagated_clock_guards.py"
    tags: [sdc, constraints, propagated_clock, ideal_clock, openlane, sta, cts, fanout, signoff, sienna, chronos, orion, uart]
    source: {title: "OpenLane 2.3.10 scripts/openroad/common/io.tcl", url: "https://github.com/efabless/openlane2/blob/main/openlane/scripts/openroad/common/io.tcl"}
    date: "2026-10-06"
    confidence: high
    owner: Sage
  - id: s2s-eq-003
    kind: s2s_lesson
    title: "Synthesis merged identical registers: run Yosys opt on the RTL side so the merged register keeps a matching name"
    symptom: "LEC proves most points but leaves outputs unproven that depend on a register present in the RTL but missing by name in the netlist (spi_master: rx_data[15:8] via u_spi_shift.wl_q; netlist has only u_spi_clkgen.wl_q)"
    root_cause: "Two RTL registers with the same D, enable, reset and init (spi_master: both wl_q latch word_len on start_acc) are merged into one flop by synthesis (Yosys opt_merge); OpenLane's quiet log does not record the merge, so name-based register correspondence has nothing to pair the removed register with."
    wrong_assumption: "Unproven points after synthesis mean the netlist differs from the RTL; a single opt_merge on the RTL side is enough (the two registers still had different mux cells in front; the full `opt` loop is needed)."
    lesson: "Run Yosys `opt` (opt_expr/opt_merge/opt_dff to a fixpoint) on the RTL side before equiv_make: it makes the same equivalence-preserving merges as synthesis, and registers that differ are never merged, so a wrong merge still fails. Confirm with caught mutants that the check still fails."
    evidence: "spi_master run_01M484JWYZ7ADCE8N97SZV80QG synth: 95/8 without opt, 103/0 with opt; caught mutants spi_shift_L59_stuck_bit_2 (1 unproven), L86_wrong_operator_2 (15), L90_swapped_condition_1 (17), spi_clkgen_L87_off_by_one_2 (1)"
    regression_test: "tests/platform/test_lec_fallback.py::test_lec_with_register_merge_still_rejects_real_bugs"
    tags: [equivalence, lec, register_merging, opt_merge, yosys, synthesis, netlist, sienna, spi_master]
    source: {title: "Synopsys Formality SVF guidance (register merging) / Yosys opt_merge", url: "https://yosyshq.readthedocs.io/projects/yosys/en/stable/cmd/opt_merge.html"}
    date: "2026-10-06"
    confidence: high
    owner: Sage
