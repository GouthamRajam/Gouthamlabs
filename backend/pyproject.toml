# Python 3.11+. Runtime dependencies are pinned in requirements.txt (M0.3: FastAPI,
# SQLAlchemy 2 + Alembic + psycopg, Redis, pydantic, PyYAML). pgvector and the Anthropic SDK
# arrive with the milestones that use them (knowledge base / real model gateway, M0.5).
[project]
name = "s2s"
version = "0.0.0"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures", "golden"]  # fixtures hold cocotb tests that run inside the simulator
markers = [
    "eda: runs real tools in the s2s-eda image (needs docker + image)",
    "slow: long real runs (OpenLane full flow, minutes each)",
]
