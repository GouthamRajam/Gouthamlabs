currency: USD
alerts_pct: [80, 100]
approval_ladder: {manager_extra_pct: 20, director_extra_pct: 50, above: human}
monthly_budget_usd: {llm: 3000, compute: 800, storage: 50}   # placeholders; set from real data
per_run_max_usd: 75
# Hard spend caps (Part 28.3), edited in Settings -> Spend controls (which rewrites this one line).
# Once a cap is reached the run stops: no further model call is made (the call that crosses
# the cap has already completed; its cost is only known when it returns).
# Placeholders until set in Settings.
spend_caps: {per_design_usd: 8.00, daily_usd: 15.00}
reconcile_tolerance_pct: 1
agents_can_move_money: false
# Prices used by the usage meter. USD per million tokens. `dummy-model` exists only for the
# M0.3 dummy agent (no real API calls are made); real provider prices are added with the
# real model gateway provider (M0.5). Placeholders, like the budgets above.
model_prices:
  dummy-model: {input_per_mtok: 3.00, output_per_mtok: 15.00}
  claude-sonnet-5-5: {input_per_mtok: 2.00, output_per_mtok: 10.00}   # Anthropic list price, 2026-09
  # Personal localhost dev mode (S2S_MODEL_PROVIDER=bridge): calls are answered by Claude Code subagents;
  # their cost is the Claude Code session's usage, NOT metered here, and the spend caps do not limit them.
  claude-code-bridge: {input_per_mtok: 0.00, output_per_mtok: 0.00}
# Which provider answers the agents' model calls (CEO decision 2026-10-04: no API usage; every call
# goes to the Claude Code bridge). "bridge" or "anthropic"; the env var S2S_MODEL_PROVIDER overrides it.
model_provider: bridge
compute_usd_per_cpu_hour: 0.05   # placeholder for local compute metering
