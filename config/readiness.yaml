# Tape-out Readiness Report weights (MASTER_SPEC Part 22).
baselines: {A: open_sky130_shuttle, B: commercial_production}
weights:
  functional_sim: 12
  coverage: 8
  formal_equiv: 10
  drc: 14
  lvs: 14
  antenna: 4
  density: 4
  sta_setup_hold: 12
  power: 4
  ir_em_static: 4
  dft_atpg: 5
  signal_integrity: 3
  reliability: 3
  foundry_signoff: 3
  gds_integrity_repro: 6
require_assumptions_block: true   # a score without the assumptions block is invalid
# Part 22.3 "Partial" in Baseline A, per check (decision 2026-10-06; replaces the single shared 0.5 of M0.7).
partial_credit:
  ir_em: 0.5   # static IR: measured, passed; EM: not analysed (Phase 1) -> half the weight, for static IR only
  dft: 0       # DFT: deferred, nothing measured -> 0; never earns credit without a measured fault coverage
# Not part of the 2026-10-06 decision; unchanged from M0.7 so Baseline B does not move: what Baseline B's
# "Partial" earns (DRC, LVS, STA, power: open decks/tools, not the foundry's), and what a check earns when
# only part of its own evidence passed (e.g. RTL sim passed but gate-level sim did not).
partial_other: 0.5
