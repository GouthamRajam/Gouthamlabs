topic: "Equivalence checking approaches tried and failed before BMC"
summary: |
  Eight structural equivalence approaches were tried for RTL-vs-gate checking on PicoRV32
  before the miter-circuit BMC method succeeded. All failed due to fundamental limitations
  with register-file re-encoding during Yosys synthesis (32×32-bit 2D array → 1024
  individual flip-flops with different naming/encoding).

  Failure log (chronological):
  1. eqy with read_liberty: "Missing function on output GCLK" — liberty cell GCLK output
     has no boolean function defined, eqy cannot model it.
  2. eqy with Verilog cell models: UDP (User-Defined Primitive) parse error — sky130 models
     use UDPs that eqy's Verilog parser doesn't handle.
  3. eqy with -DFUNCTIONAL: defines not passed through to the correct read_verilog stage.
  4. Direct Yosys equiv_make: register file signal matching failure — RTL regfile[0..31]
     vs gate _0000_ through _1023_ naming mismatch.
  5. equiv_opt with -map liberty: -map expects a Verilog file, not a .lib.
  6. equiv_opt without -map: 707 unproven sequential cells (all DFFs unresolved).
  7. Manual equiv_make + equiv_induct: register file marked "failed" on induction step
     (same re-encoding problem, induction hypothesis can't establish correspondence).
  8. sby with read_liberty -lib: blackbox modules can't be flattened for BMC.

  The successful approach (attempt 9): write a Verilog miter circuit that instantiates both
  RTL and gate-level netlist, drives identical inputs, asserts all outputs match, then use
  SymbiYosys BMC (not induction) with behavioral sky130 cell models.
evidence:
  - path: designs/picorv32/synth_dft/miter.sv
    note: "The working miter circuit"
  - path: designs/picorv32/synth_dft/equiv_sby.sby
    note: "SymbiYosys BMC config"
tags: [equivalence, eqy, yosys, symbiyosys, phase-1, failure-analysis]
status: confirmed
date: 2026-10-08
related: [k003-bmc-equiv-depth10]
lesson: |
  Structural equivalence tools assume stable signal naming between gold and gate. Yosys
  synthesis re-encodes arrays, breaking that assumption. For designs with array-based
  register files, use behavioral BMC (miter circuit) rather than structural matching.
  This is a known limitation, not a bug.
