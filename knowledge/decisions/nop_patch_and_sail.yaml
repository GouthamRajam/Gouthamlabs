tags: [compliance, rv32i, sail, nop-patch, phase-1, trust-layer, gas-defect]
status: confirmed
date: 2026-10-08
related: [k003-bmc-equiv-depth10]
lesson: |
  When test infrastructure has defects, prove the defect exists independently rather than
  working around it silently. The NOP-patch was proven legitimate by showing: (a) zeros are
  reachable code, (b) any correct implementation would trap, (c) the assembler should have
  emitted NOPs, (d) Sail independently confirms the RTL is correct with the patch applied.
