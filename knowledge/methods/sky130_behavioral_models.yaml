lesson: |
  Behavioral cell models must cover every cell type the synthesizer can emit. When Yosys
  picks a cell not in the model file, gate-level simulation silently produces X outputs.
  After synthesis, compare the cell list from `stat` against the model file and add any
  missing cells before proceeding to simulation or fault analysis.
