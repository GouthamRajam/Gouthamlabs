lesson: |
  OpenSTA's Tcl API varies between versions. The `sta::worst_slack` proc is not available
  in all builds; use `report_checks`, `report_tns`, and `report_wns` for portable output.
  Port names in the SDC constraints must match the Verilog exactly (case-sensitive) —
  `get_ports clk` fails if the design uses `CLK`.
