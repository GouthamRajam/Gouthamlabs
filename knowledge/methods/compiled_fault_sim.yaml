lesson: |
  Yosys JSON netlist format uses string "0" and "1" for constant bit connections, not
  integer 0 and 1. Any tool parsing the JSON must check isinstance(b, str) before treating
  bit indices as wire numbers. Missing this check causes template variables to go
  unsubstituted in the generated C code, producing compile errors.
