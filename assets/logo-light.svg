<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="trace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Chip die icon -->
  <rect x="12" y="20" width="80" height="80" rx="6" fill="none" stroke="url(#chip)" stroke-width="3"/>
  <rect x="26" y="34" width="52" height="52" rx="3" fill="url(#chip)" opacity="0.08"/>
  <rect x="34" y="42" width="36" height="36" rx="2" fill="url(#chip)" opacity="0.15"/>
  <!-- Pins top -->
  <line x1="30" y1="8" x2="30" y2="20" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="8" x2="44" y2="20" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="8" x2="58" y2="20" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="8" x2="72" y2="20" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pins bottom -->
  <line x1="30" y1="100" x2="30" y2="112" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="100" x2="44" y2="112" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="100" x2="58" y2="112" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="100" x2="72" y2="112" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pins left -->
  <line x1="0" y1="38" x2="12" y2="38" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="52" x2="12" y2="52" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="66" x2="12" y2="66" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="80" x2="12" y2="80" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="92" y1="38" x2="104" y2="38" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="52" x2="104" y2="52" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="66" x2="104" y2="66" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="80" x2="104" y2="80" stroke="url(#chip)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Inner die detail -->
  <path d="M38 52 h12 v10 h8" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
  <path d="M38 62 h6 v8 h14" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
  <path d="M46 46 v12" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <circle cx="52" cy="56" r="3" fill="#0ea5e9" opacity="0.4"/>
  <circle cx="58" cy="62" r="2" fill="#6366f1" opacity="0.4"/>
  <!-- Text: Goutham -->
  <text x="120" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#1e293b" letter-spacing="-0.5">Goutham</text>
  <!-- Text: Labs -->
  <text x="342" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="300" fill="#475569" letter-spacing="-0.5">Labs</text>
  <!-- Tagline -->
  <text x="120" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" letter-spacing="3">SPEC-TO-SILICON  ·  AI CHIP DESIGN</text>
  <!-- Accent line -->
  <line x1="120" y1="92" x2="420" y2="92" stroke="url(#trace)" stroke-width="1.5" opacity="0.3"/>
</svg>
