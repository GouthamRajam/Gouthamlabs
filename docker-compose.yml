# Postgres and Redis (M0.1); migrate, api and orchestrator (M0.3); web, the Live Office (M0.4)
# at http://localhost:3000, whose browser code calls the api at <host>:8000.
# The orchestrator runs the EDA tools in the s2s-eda image (build it first: docker build -t s2s-eda eda/)
# as sibling containers through the host's Docker socket. A sibling mounts a run folder by its HOST path,
# so run data (var/artifacts) and the Claude Code bridge folder (var/bridge) are bind-mounted at the
# SAME absolute path inside the backend containers (${PWD} = the repo root where you run compose).
# Model calls go to the Claude Code bridge by default (config/finance.yaml model_provider: bridge);
# S2S_MODEL_PROVIDER=anthropic overrides it (see docs/DECISIONS.md).
x-backend: &backend
  build: {context: ., dockerfile: backend/Dockerfile}
  image: s2s-backend
  environment:
    S2S_DATABASE_URL: postgresql+psycopg://s2s:s2s@postgres:5432/s2s
    S2S_REDIS_URL: redis://redis:6379/0
    S2S_ARTIFACT_DIR: ${PWD}/var/artifacts
    S2S_SECRETS_DIR: /data/secrets   # Settings -> Model access (encrypted, Part 28.5)
    S2S_BRIDGE_DIR: ${PWD}/var/bridge
    S2S_EDA_IMAGE: s2s-eda
    S2S_MODEL_PROVIDER: ${S2S_MODEL_PROVIDER:-}
    S2S_REGRESS_TIMEOUT_S: ${S2S_REGRESS_TIMEOUT_S:-2400}
    S2S_MUTATION_PARALLEL: ${S2S_MUTATION_PARALLEL:-4}
  volumes:
    - ${PWD}/var/artifacts:${PWD}/var/artifacts
    - ${PWD}/var/bridge:${PWD}/var/bridge
    - secrets:/data/secrets
    # Settings -> Spend controls rewrites config/finance.yaml spend_caps; the orchestrator and
    # the API must see the same file (and changes land in the repo's config, not in a container)
    - ./config:/app/config

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: s2s
      POSTGRES_PASSWORD: s2s
      POSTGRES_DB: s2s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s2s -d s2s"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.6-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    <<: *backend
    command: ["python", "-m", "s2s.orchestrator"]
    volumes:  # the shared mounts again (a service-level list replaces the anchor's), plus the Docker socket
      - ${PWD}/var/artifacts:${PWD}/var/artifacts
      - ${PWD}/var/bridge:${PWD}/var/bridge
      - secrets:/data/secrets
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    build: {context: ., dockerfile: web/Dockerfile}
    image: s2s-web
    ports:
      - "3000:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  secrets:
