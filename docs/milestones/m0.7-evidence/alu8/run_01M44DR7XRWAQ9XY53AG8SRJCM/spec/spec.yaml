design: alu8
version: 1
summary: "8-bit synchronous ALU with registered result and N/Z/C/V flags: add, subtract, AND, OR, XOR, shift left/right, compare."
pdk: sky130A
std_cell_library: sky130_fd_sc_hd
target_clock_mhz: 75
target_clock_note: "75 MHz requested in request.md (period 13.333 ns); PDK and library choice are DEFAULT - needs G1 review"
clocks:
  - {name: clk, freq_mhz: 75}
resets:
  - {name: rst_n, active: low, type: synchronous}
interfaces:
  - {name: clk, dir: in, width: 1, description: "Single clock, rising edge active."}
  - {name: rst_n, dir: in, width: 1, clock_domain: clk, description: "Synchronous active-low reset, sampled on rising clk."}
  - {name: a, dir: in, width: 8, clock_domain: clk, description: "Operand A, unsigned or two's complement; sampled every rising clk."}
  - {name: b, dir: in, width: 8, clock_domain: clk, description: "Operand B; for SHL/SHR only b[2:0] is the shift amount (0..7) and b[7:3] is ignored."}
  - {name: op, dir: in, width: 3, clock_domain: clk, values: {0: ADD, 1: SUB, 2: AND, 3: OR, 4: XOR, 5: SHL, 6: SHR, 7: CMP}, description: "Operation select; all 8 codes are defined, so no invalid opcode exists."}
  - {name: result, dir: out, width: 8, clock_domain: clk, reset_value: 0, description: "Registered result; updated on every rising clk except when op is CMP (holds)."}
  - {name: flag_z, dir: out, width: 1, clock_domain: clk, reset_value: 0, description: "Zero flag, registered."}
  - {name: flag_c, dir: out, width: 1, clock_domain: clk, reset_value: 0, description: "Carry flag, registered. For SUB/CMP, C=1 means no borrow (a>=b unsigned)."}
  - {name: flag_v, dir: out, width: 1, clock_domain: clk, reset_value: 0, description: "Signed overflow flag, registered."}
  - {name: flag_n, dir: out, width: 1, clock_domain: clk, reset_value: 0, description: "Negative flag (MSB of the 8-bit operation result), registered."}
requirements:
  - id: REQ-001
    type: functional
    text: "On each rising clk with rst_n=1 and op=ADD (0), result <= (a + b) mod 256 and flag_c <= carry out of bit 7 of the 9-bit sum."
    acceptance: "Exhaustive sweep of all 65,536 (a,b) pairs matches the reference model for result and flag_c with 0 mismatches."
  - id: REQ-002
    type: functional
    text: "On each rising clk with rst_n=1 and op=SUB (1), result <= (a - b) mod 256 computed as a + ~b + 1, and flag_c <= carry out of that addition (1 means no borrow, a>=b unsigned)."
    acceptance: "Exhaustive sweep of all 65,536 (a,b) pairs matches the reference model for result and flag_c with 0 mismatches."
  - id: REQ-003
    type: functional
    text: "For op=AND (2), OR (3), XOR (4), result <= a&b, a|b, a^b respectively; flag_c and flag_v are set to 0."
    acceptance: "Exhaustive sweep of all 65,536 (a,b) pairs per operation matches the reference model for result, flag_c, flag_v with 0 mismatches."
  - id: REQ-004
    type: functional
    text: "For op=SHL (5), result <= a shifted left logically by n=b[2:0] bits (zero fill); flag_c <= last bit shifted out (a[8-n]) for n>=1 and 0 for n=0; flag_v <= 0."
    acceptance: "Exhaustive sweep of all 256 a values x 8 shift amounts, with b[7:3] swept over all 32 values, matches the reference model with 0 mismatches."
  - id: REQ-005
    type: functional
    text: "For op=SHR (6), result <= a shifted right logically by n=b[2:0] bits (zero fill, not arithmetic); flag_c <= last bit shifted out (a[n-1]) for n>=1 and 0 for n=0; flag_v <= 0."
    acceptance: "Exhaustive sweep of all 256 a values x 8 shift amounts, with b[7:3] swept over all 32 values, matches the reference model with 0 mismatches."
  - id: REQ-006
    type: functional
    text: "For op=CMP (7), flags are updated as for SUB (a - b) while result holds its previous value; unsigned a>=b is flag_c, a==b is flag_z, and signed a<b is flag_n XOR flag_v."
    acceptance: "Exhaustive sweep of all 65,536 (a,b) pairs: flags match the reference SUB flags, result unchanged in all 65,536 cases, and the three comparison conditions match Python integer comparison with 0 mismatches."
  - id: REQ-007
    type: functional
    text: "flag_z <= 1 iff the 8-bit operation result is 0, and flag_n <= bit 7 of the 8-bit operation result, for every op (for CMP, of the difference a-b mod 256)."
    acceptance: "Across all 8 opcodes and all 65,536 (a,b) pairs (524,288 vectors), flag_z and flag_n match the reference model with 0 mismatches."
  - id: REQ-008
    type: functional
    text: "flag_v is the signed overflow, equal to carry into bit 7 XOR carry out of bit 7, for ADD, SUB and CMP; flag_v is 0 for AND, OR, XOR, SHL, SHR."
    acceptance: "Exhaustive sweep of all 65,536 (a,b) pairs for ADD, SUB, CMP: flag_v matches signed overflow of the reference model; flag_v=0 in all 5 other opcodes' sweeps, 0 mismatches."
  - id: REQ-009
    type: interface
    text: "All outputs (result, flag_z, flag_c, flag_v, flag_n) are registered: they change only immediately after a rising clk edge, with a latency of exactly 1 clock cycle from the a/b/op values sampled at that edge."
    acceptance: "Simulation: changing a/b/op between clock edges causes 0 output changes before the next rising edge; outputs equal the reference model of the inputs from the previous edge in 100% of 10,000 random cycles."
  - id: REQ-010
    type: reset
    text: "rst_n is synchronous, active low. When rst_n=0 at a rising clk, result=0x00, flag_z=0, flag_c=0, flag_v=0, flag_n=0 regardless of a, b, op."
    acceptance: "Directed test: asserting rst_n=0 for 1 clock with random a/b/op over 1,000 trials gives all 5 outputs equal 0 after the edge; checked by a formal property as well."
    note: "flag_z resets to 0 (not 1) so that reset state is not a computed result; DEFAULT - needs G1 review"
  - id: REQ-011
    type: reset
    text: "Every state element (result register and 4 flag registers) is reset by rst_n; after rst_n deasserts, the first rising clk with rst_n=1 computes normally from the sampled a, b, op."
    acceptance: "Directed test: reset release followed by 1,000 random operations matches the reference model with 0 mismatches; no state element is left without a reset in the synthesized netlist (0 unreset flops)."
  - id: REQ-012
    type: functional
    text: "Behavior on invalid or undefined inputs: all 8 op codes are defined, so there is no invalid opcode; op, a, b are assumed to be driven to 0 or 1 (X/Z inputs are out of scope); b[7:3] is ignored for shifts."
    acceptance: "Opcode sweep 0..7 produces 8 distinct defined behaviors checked against the reference model; shifts with b[7:3] in 0..31 give identical results (0 mismatches)."
  - id: REQ-013
    type: functional
    text: "Overflow and underflow never raise an error or stall: ADD/SUB wrap modulo 256 and are reported only via flag_c and flag_v. There are no simultaneous-control conflicts because op is a single encoded select; rst_n=0 has priority over all operations."
    acceptance: "Directed boundary cases (0xFF+0x01, 0x7F+0x01, 0x80-0x01, 0x00-0x01, 0x80+0x80) match the reference model; rst_n=0 with any op gives the reset values in 100% of 1,000 trials."
  - id: REQ-014
    type: clock
    text: "Single clock domain clk at 75 MHz (period 13.333 ns), rising edge; no asynchronous inputs and no clock-domain crossings are required inside the design."
    acceptance: "Static timing analysis on the post-route netlist at the sky130A typical corner reports setup WNS >= 0.0 ns at a 13.333 ns clock period and hold WNS >= 0.0 ns, as decided by the real STA tool."
    note: "Input/output delay budget is an assumption; see open_questions."
  - id: REQ-015
    type: performance
    text: "Throughput is one operation per clock cycle with no wait states: 75 million operations per second at 75 MHz."
    acceptance: "Simulation of 10,000 back-to-back operations produces 10,000 correct results in 10,000 + 1 clock cycles (1 cycle latency)."
  - id: REQ-016
    type: area
    text: "RECOMMENDED - default on: report cell area; no fixed limit is set by the request. Expected design is purely combinational ALU plus 12 flops (8 result + 4 flags) in sky130_fd_sc_hd."
    acceptance: "Synthesis report states total cell area in um^2 and the flop count; flop count equals 12 (8 result + 4 flags) exactly."
    note: "No area target given; the 12-flop count is a structural check, not a size limit. DEFAULT - needs G1 review"
  - id: REQ-017
    type: test
    text: "Verification shall include an exhaustive operand sweep per operation against an independent reference model, plus reset and boundary tests, with all outputs compared every cycle."
    acceptance: "Testbench runs 8 x 65,536 = 524,288 vectors plus reset and directed tests, with 0 mismatches reported by the real simulator."
out_of_scope:
  - "Arithmetic right shift, rotate, multiply, divide"
  - "Carry-in input and multi-word (chained) arithmetic"
  - "Any bus or protocol interface (AXI, APB, Wishbone, SPI)"
  - "Input valid/enable handshake or output valid signal"
  - "Pipelining deeper than 1 stage"
  - "Handling of X/Z or glitching inputs; asynchronous inputs and clock-domain crossing"
  - "Power targets and low-power modes"
open_questions:
  - "Compare behavior (DEFAULT - needs G1 review): CMP updates flags only and result holds its previous value. Alternative: result is cleared or shows a-b. Which is wanted?"
  - "Shift semantics (DEFAULT - needs G1 review): shift amount is b[2:0] (0..7), logical right shift, C is last bit shifted out. Alternative: fixed shift by 1 bit."
  - "Carry convention for SUB/CMP (DEFAULT - needs G1 review): C=1 means no borrow (A + ~B + 1). Alternative: C=1 means borrow."
  - "Opcode encoding (DEFAULT - needs G1 review): 0 ADD, 1 SUB, 2 AND, 3 OR, 4 XOR, 5 SHL, 6 SHR, 7 CMP."
  - "Reset value of flag_z (DEFAULT - needs G1 review): 0 after reset. Alternative: 1 (as if result were zero)."
  - "I/O timing: no input/output delay budget is given; assume inputs arrive and outputs leave with 0 ns external delay unless the customer states one."
